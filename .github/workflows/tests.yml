name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mock server dependencies
        working-directory: tests
        run: npm ci

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false

      - name: Import Godot project
        run: godot --headless --import 2>&1 || true

      - name: Start mock server
        run: |
          echo "LUXODD_MOCK_FRAMES=$RUNNER_TEMP/frames.json" >> "$GITHUB_ENV"
          LUXODD_MOCK_FRAMES="$RUNNER_TEMP/frames.json" node tests/mock_server.js 8765 &
          sleep 1

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --path . 2>&1 | tee "$RUNNER_TEMP/godot.log"

      - name: Run the frozen 1.0.0 suite against this plugin (backward compatibility)
        run: godot --headless --path . res://tests/compat/test_runner_1_0_0.tscn 2>&1

      - name: Logs never contain the player's email or a session token
        run: |
          for secret in "test@luxodd.com" "test_token_abc123" "test_token_B"; do
            if grep -q -- "$secret" "$RUNNER_TEMP/godot.log"; then
              echo "::error::The Godot log contains a test secret ($secret)"; exit 1
            fi
          done
